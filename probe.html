<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report — Central de Projetos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=20260825i">
</head>
<!-- Página autônoma: só o report, sem as telas de acompanhamento do PO.
     Não existe header de aplicação aqui, de propósito: o documento é a página
     inteira, da primeira linha à última. O mês mora na navegação do próprio
     documento, e as ferramentas do PO ficam numa barra flutuante que só aparece
     pra quem tem token. Quem abre pelo link não vê ferramenta nenhuma. -->
<body data-pagina="report" class="pagina-report">
<div class="app">
<div class="corpo">
<main>
  <section id="secao-report">
    <div id="report"><p class="mudo">carregando…</p></div>
  </section>
</main>
</div>
</div>

<div class="ferramentas" id="ferramentas" hidden>
  <span id="badge" data-estado="sem-token">sem token</span>
  <select id="resp-global" title="Recorte por responsável" hidden><option value="">todos os responsáveis</option></select>
  <button id="atualizar" title="Atualizar agora">↻</button>
  <button id="copiar" class="botao-texto" title="Copia o endereço desta página — quem abrir lê o report sem token">Copiar link</button>
  <a id="voltar" class="botao-texto" href="index.html#panorama" title="Voltar para a Central">Central</a>
</div>
<div id="caixa-link" class="caixa-link" hidden></div>

<script>
/* SÓ PARA TESTE LOCAL — arquivo temporário, não vai pro git. */
localStorage.setItem('central.config', JSON.stringify({
  org: 'https://dev.azure.com/nivello',
  projects: [{ projectName: 'Ecommerce', teamName: 'Squad Ecommerce', hidden: false }],
}));
localStorage.setItem('central.pat', 'pat-de-teste');
localStorage.removeItem('central.cache');
localStorage.removeItem('central.filtros');
const U = 'Urlan Dipre';
const A2 = 'Ana Prado';
const d = (iso) => new Date(iso).toISOString();
function wi(id, tipo, titulo, estado, dono, extra) {
  return { id, fields: Object.assign({
    'System.WorkItemType': tipo, 'System.Title': titulo, 'System.State': estado,
    'System.AssignedTo': dono ? { displayName: dono } : undefined,
    'System.ChangedDate': d('2026-08-19'),
  }, extra || {}) };
}
const CATALOGO = [
  // épicos (1 e 10 fora da área — chegam só pela busca de pais)
  wi(1, 'Epic', 'Nova PDP USA', 'Active', 'Outra Pessoa', { 'Microsoft.VSTS.Scheduling.TargetDate': d('2026-10-15') }),
  wi(10, 'Feature', 'Template global de loja', 'Active', null, { 'System.Parent': 1 }),
  wi(2, 'Epic', 'Tema Global', 'Active', U, { 'Microsoft.VSTS.Scheduling.TargetDate': d('2026-09-05') }),
  wi(3, 'Epic', 'Checkout Unificado', 'Active', U),
  wi(4, 'Epic', 'Fidelidade e Assinatura — Programa de Recompra Internacional com Regras Regionais por País', 'Active', U, { 'Microsoft.VSTS.Scheduling.TargetDate': d('2026-11-20') }),
  wi(5, 'Epic', 'App Mobile', 'Active', U),
  // agosto — 11 entregas em 5 produtos + sem produto
  wi(44320, 'Product Backlog Item', '13 - Componentes de Ícones', 'Closed', U, { 'System.Parent': 10, 'Microsoft.VSTS.Common.ClosedDate': d('2026-08-11') }),
  wi(44321, 'Product Backlog Item', '14 - Componentes de Imagem + Copy com variações de layout para PDP, PLP e Home — inclui migração das lojas EUA e BR e QA cross-browser em todos os breakpoints', 'Closed', U, { 'System.Parent': 10, 'Microsoft.VSTS.Common.ClosedDate': d('2026-08-12') }),
  wi(44324, 'Product Backlog Item', '15 - Grid Editorial de Benefícios', 'Closed', U, { 'System.Parent': 10, 'Microsoft.VSTS.Common.ClosedDate': d('2026-08-12') }),
  wi(44304, 'Feature', 'Rating, título e descrição reduzida', 'Closed', U, { 'System.Parent': 2 }), // sem ClosedDate → aproximada
  wi(44325, 'Product Backlog Item', '16 - Hotspots Interativos', 'Closed', U, { 'System.Parent': 2, 'Microsoft.VSTS.Common.ClosedDate': d('2026-08-13') }),
  wi(44500, 'Product Backlog Item', 'Login social Google e Facebook', 'Closed', U, { 'System.Parent': 3, 'Microsoft.VSTS.Common.ClosedDate': d('2026-08-14') }),
  wi(44501, 'Product Backlog Item', 'Pix no checkout', 'Closed', U, { 'System.Parent': 3, 'Microsoft.VSTS.Common.ClosedDate': d('2026-08-15') }),
  wi(44600, 'Product Backlog Item', 'Regra de pontos por país', 'Closed', U, { 'System.Parent': 4, 'Microsoft.VSTS.Common.ClosedDate': d('2026-08-16') }),
  wi(44700, 'Product Backlog Item', 'Push de carrinho abandonado', 'Closed', U, { 'System.Parent': 5, 'Microsoft.VSTS.Common.ClosedDate': d('2026-08-17') }),
  wi(45423, 'Product Backlog Item', 'Melhorias das Lojas EUA e Brasil ao Tema Global', 'Closed', U, { 'Microsoft.VSTS.Common.ClosedDate': d('2026-08-12') }),
  wi(45500, 'Bug', 'Corrigir arredondamento de frete', 'Closed', U), // sem produto, sem ClosedDate → aproximado
  // em execução / travados
  wi(44400, 'Product Backlog Item', 'Carrinho com brinde progressivo', 'Active', U, { 'System.Parent': 10, 'Microsoft.VSTS.Scheduling.TargetDate': d('2026-08-28') }),
  wi(44401, 'Product Backlog Item', 'Frete grátis acima de 200', 'Blocked', U, { 'System.Parent': 2, 'Microsoft.VSTS.Scheduling.TargetDate': d('2026-08-01'), 'System.ChangedDate': d('2026-07-20') }),
  wi(44402, 'Product Backlog Item', 'Assinatura mensal — contrato', 'Blocked', U, { 'System.Parent': 4, 'System.ChangedDate': d('2026-08-10') }),
  wi(44403, 'Product Backlog Item', 'Onboarding do app', 'Active', U, { 'System.Parent': 5 }),
  wi(44404, 'Product Backlog Item', 'Checkout expresso', 'Active', U, { 'System.Parent': 3, 'Microsoft.VSTS.Scheduling.TargetDate': d('2026-09-12') }),
  wi(44405, 'Product Backlog Item', 'Item da Ana em execução', 'Active', A2, { 'System.Parent': 2 }),
  // julho / junho
  wi(43100, 'Product Backlog Item', 'Rating e descrição', 'Closed', U, { 'System.Parent': 2, 'Microsoft.VSTS.Common.ClosedDate': d('2026-07-18') }),
  wi(43101, 'Feature', 'Busca interna', 'Closed', U, { 'System.Parent': 2, 'Microsoft.VSTS.Common.ClosedDate': d('2026-07-22') }),
  wi(43102, 'Product Backlog Item', 'Filtro por categoria', 'Closed', A2, { 'System.Parent': 10, 'Microsoft.VSTS.Common.ClosedDate': d('2026-07-09') }),
  wi(42000, 'Product Backlog Item', 'Header novo', 'Closed', U, { 'System.Parent': 10, 'Microsoft.VSTS.Common.ClosedDate': d('2026-06-09') }),
];
const NA_AREA = CATALOGO.filter((x) => ![1, 10].includes(x.id)).map((x) => x.id);
window.fetch = async (url, opt) => {
  const j = (o) => new Response(JSON.stringify(o), { headers: { 'content-type': 'application/json' } });
  if (url.includes('connectionData')) return j({ authenticatedUser: { providerDisplayName: U } });
  if (url.includes('teamfieldvalues')) return j({ values: [{ value: 'Ecommerce', includeChildren: true }] });
  if (url.includes('wiql')) return j({ workItems: NA_AREA.map((id) => ({ id })) });
  if (url.includes('workitemsbatch')) {
    const pedido = JSON.parse(opt.body);
    return j({ value: pedido.ids.map((id) => {
      const a = CATALOGO.find((x) => x.id === id);
      if (!a) return null;
      const campos = {};
      for (const c of pedido.fields) if (a.fields[c] !== undefined) campos[c] = a.fields[c];
      return { id: a.id, fields: campos };
    }) });
  }
  return j({ value: [] });
};
</script>
<script src="assets/core.js?v=20260825i"></script>
<script src="assets/api.js?v=20260825i"></script>
<script src="assets/briefing.js?v=20260825i"></script>
<script src="assets/report.js?v=20260825i"></script>
</body>
</html>
