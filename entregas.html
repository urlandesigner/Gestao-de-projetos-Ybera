<!-- PREVIEW DE COMPARTILHAMENTO (Open Graph + Twitter Card).
     O link deste documento circula colado no WhatsApp, no Slack e no e-mail, e
     sem estas linhas ele chega como uma URL crua do github.io.

     Tudo aqui é ESTÁTICO de propósito, e tem que ser: quem lê estas tags é um
     robô que não roda JavaScript e nunca recebe o `#r=...` — o fragmento não
     sai do navegador, não é enviado ao servidor. Então o robô vê sempre esta
     página vazia, não o relatório montado. O preview é um cartaz do documento,
     não um retrato do link.

     O que o cartaz afirma é só o PERÍODO, e isso é deliberado: contagem
     envelhece a cada PBI que muda de coluna no board, e preview fica preso no
     cache dos apps por tempo indeterminado — diria 31 enquanto o relatório já
     abre em 40. Preview que mente é pior que preview nenhum. Período só muda
     quando o documento vira outro documento.

     Então quando o relatório virar outro mês, o og:title abaixo e a imagem
     mudam na mesma rodada: ./scripts/og-entregas.sh "Outubro de 2026".

     A imagem leva o mesmo ?v= do resto: WhatsApp, Slack e LinkedIn guardam o
     preview por URL e não voltam pra conferir. Trocar o token é o que faz o
     cartaz novo chegar em quem já viu o antigo. -->

     O link de leitura (#r=...) gerado aqui abre aqui.

<!-- Visor das telas da galeria. Mora na página, não no documento: o report.js
     redesenha #report inteiro a cada render, e o <dialog> precisa sobreviver a
     isso. Por ser <dialog> nativo, Esc pra fechar, foco preso dentro e fundo
     escurecido vêm de graça — sem biblioteca. -->
<dialog id="visor" class="rl-visor" aria-label="Visualização da tela">
  <button type="button" id="visor-fechar" class="rl-visor-fechar" aria-label="Fechar">✕</button>
  <img id="visor-img" alt="">
  <p id="visor-legenda" class="rl-visor-legenda"></p>
</dialog>

<script src="assets/core.js?v=2026100201"></script>
<script src="assets/api.js?v=2026100201"></script>
<script src="assets/briefing-entregas.js?v=2026100201"></script>
<script src="assets/report.js?v=2026100201"></script>
<script>
/* Visor da galeria — vive aqui, e não no report.js nem no briefing.

   No report.js porque ele é compartilhado com report.html e report-v2.html, que
   não têm galeria; no briefing porque ele é módulo de render puro, testado no
   Node, e não deve tocar em evento de DOM.

   O clique é delegado em #report: o documento é redesenhado a cada troca de
   dado, e ouvir no container é o que sobrevive a isso. O <a> continua válido —
   se este script falhar, o clique leva à imagem como antes. */
(function () {
  'use strict';
  const box = document.getElementById('report');
  const visor = document.getElementById('visor');
  const img = document.getElementById('visor-img');
  const legenda = document.getElementById('visor-legenda');
  if (!box || !visor || !visor.showModal) return; // sem <dialog>, o <a> resolve

  box.addEventListener('click', (ev) => {
    const link = ev.target.closest('.rl-fig-link');
    if (!link) return;
    ev.preventDefault();
    const fig = link.closest('.rl-fig');
    const texto = fig && fig.querySelector('figcaption');
    img.src = link.getAttribute('href');
    img.alt = texto ? texto.textContent : '';
    legenda.textContent = texto ? texto.textContent : '';
    visor.showModal();
  });

  // Fechar solta a imagem na hora, e não no evento `close`: o `close` do
  // <dialog> é disparado de forma assíncrona, então confiar nele deixava o src
  // da tela anterior pendurado por um tempo indefinido. O listener continua
  // como rede pro Esc, que fecha sem passar por aqui.
  function fechar() {
    visor.close();
    img.removeAttribute('src');
  }
  // Clique no fundo fecha: o alvo só é o próprio <dialog> quando o ponto cai
  // fora da área do conteúdo.
  visor.addEventListener('click', (ev) => { if (ev.target === visor) fechar(); });
  document.getElementById('visor-fechar').addEventListener('click', fechar);
  visor.addEventListener('close', () => { img.removeAttribute('src'); });
})();
</script>
