<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cartão de compartilhamento — Entregas</title>
<!-- FONTE DA IMAGEM DE PREVIEW (og:image) do entregas.html.

     Não é uma página do produto: é o molde de 1200×630 que o
     scripts/og-entregas.sh fotografa com o Chrome headless pra gerar
     assets/og-entregas.png. Por isso mora em scripts/ (que o
     sincronizar-pages.sh não publica) — o que vai pro ar é só o PNG.

     Por que um molde e não um print da capa real: a capa é responsiva e alta,
     e 1200×630 é um recorte 1.91:1 que nenhuma largura de tela produz. Aqui o
     mesmo conteúdo do topo — marca, retranca, título, situação e os dois
     números — é remontado na proporção que WhatsApp, Slack e LinkedIn pedem.

     COR E TIPO SÃO COPIADOS de assets/entregas.css, não reinventados: os
     tokens do :root e as duas vozes do título. Se a capa mudar de desenho,
     este arquivo é o segundo lugar a mexer.

     SEM os dois blocos de número da capa, por decisão do Urlan. E a ausência
     deles é o que mantém esta imagem honesta: número envelhece a cada PBI que
     muda de coluna no board, e um preview fica preso no cache dos apps por
     tempo indeterminado — o cartaz diria 31 enquanto o relatório já abre em
     40. Período não tem esse problema: ele só muda quando o documento vira
     outro documento. É a única variável, e entra por query string
     (?periodo=...), que é como o scripts/og-entregas.sh passa o valor. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=block" rel="stylesheet">
<style>
:root {
  /* cópia literal dos tokens de assets/entregas.css */
  --fundo-pagina: #fafaf9;
  --superficie: #ffffff;
  --tinta: #1c1c1a;
  --mudo: #78716c;
  --borda: #e9e7e4;
  --neutro: rgba(120, 113, 108, 0.3);
  --sans: 'Plus Jakarta Sans', sans-serif;
  --fio: 1px solid var(--borda);
  --raio-painel: 24px;
  --sombra-painel: 0 1px 2px rgba(28, 25, 23, 0.03), 0 16px 40px rgba(28, 25, 23, 0.06);
  --sombra-escura: 0 2px 6px rgba(28, 25, 23, 0.16), 0 20px 40px -18px rgba(28, 25, 23, 0.4);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  background: var(--fundo-pagina);
  color: var(--tinta);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}
.cartao {
  display: flex;
  flex-direction: column;
  /* Centrado na vertical: o que sobra de 1.91:1 vira margem em cima e embaixo,
     em partes iguais. Ancorado no topo, o texto ficaria pendurado com um vão
     morto embaixo — e o preview aparece pequeno, onde vão morto lê como
     imagem cortada. */
  justify-content: center;
  width: 1200px;
  height: 630px;
  padding: 64px;
}

/* `align-self` porque o cartão é um flex column: sem ele a marca herda o
   `stretch` do eixo cruzado, a largura vira a do cartão inteiro e o PNG sai
   com o logotipo esticado de ponta a ponta. `width:auto` sozinho não segura. */
.logo { align-self: flex-start; display: block; height: 46px; width: auto; }

/* Retranca: a mesma de .rl-rotulo + .rl-capa-autoria, já na versão de telefone
   (onde e quem na MESMA linha, separados por um fio). Numa imagem larga a
   autoria numa linha própria sobraria no vazio. */
.retranca {
  margin: 30px 0 0;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--mudo);
}
.autoria {
  margin-left: 0.7em;
  padding-left: 0.75em;
  border-left: 1px solid var(--neutro);
  font-size: 1.08em;
  font-weight: 600;
  letter-spacing: 0.005em;
  text-transform: none;
}

/* Título em duas vozes, como na capa: a linha fraca situa, a forte é o
   assunto. Em bloco e nos dois tamanhos do desktop (o topo do clamp). */
 /* Maior que na capa de propósito: o preview chega em miniatura na lista de
    conversas, e é o período que faz alguém abrir. `balance` porque período
    comprido ("Outubro e Novembro de 2026") quebra em duas linhas, e a quebra
    padrão deixaria "de 2026" sozinho embaixo. */
.titulo { margin: 20px 0 0; line-height: 0.98; letter-spacing: -0.04em; text-wrap: balance; }
.titulo span { display: block; }
.titulo-fraco { font-size: 54px; font-weight: 500; color: var(--mudo); }
.titulo-forte { font-size: 74px; font-weight: 800; color: var(--tinta); }

/* Sem teto de largura, ao contrário da capa: lá a linha é curta de propósito
   porque está numa coluna de leitura. Aqui ela é a legenda do cartaz e o
   cartão tem 1072px úteis — segurá-la em 46ch quebrava a frase deixando
   "meses." sozinho na segunda linha, que é a viúva clássica. `balance` cuida
   do caso em que a legenda cresça e passe a quebrar de verdade. */
.situacao { margin: 22px 0 0; font-size: 23px; line-height: 1.5; color: var(--mudo); text-wrap: balance; }

</style>
</head>
<body>
<div class="cartao">
  <img class="logo" src="../../assets/brand/ybera-logo.webp" alt="Ybera" width="360" height="139">
  <p class="retranca" id="retranca"></p>
  <h1 class="titulo"><span class="titulo-fraco">Entregas de</span><span class="titulo-forte" id="periodo"></span></h1>
  <p class="situacao" id="situacao"></p>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var val = function (chave, padrao) { return q.get(chave) || padrao; };

  document.getElementById('periodo').textContent = val('periodo', 'Agosto e Setembro de 2026');
  document.getElementById('situacao').textContent = val('situacao', 'O que o time entregou no período, e o planejamento dos próximos meses.');

  var retranca = document.getElementById('retranca');
  retranca.textContent = val('retranca', 'Ybera US · E-commerce');
  var autoria = val('autoria', 'Product Owner: Urlan Dipre');
  if (autoria) {
    var s = document.createElement('span');
    s.className = 'autoria';
    s.textContent = autoria;
    retranca.appendChild(s);
  }

  // Bandeira pro script: só fotografa depois que a Plus Jakarta Sans chegou.
  // Sem isso o Chrome headless fotografa o fallback e a imagem sai com outra
  // tipografia — o erro não dá erro nenhum, só uma imagem errada.
  document.fonts.ready.then(function () { document.documentElement.dataset.pronto = '1'; });
</script>
</body>
</html>
