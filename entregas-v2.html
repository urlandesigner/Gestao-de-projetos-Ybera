     copiadas pra cá, o cartaz deste link mandaria todo mundo pro documento

     Quando esta versão virar a oficial, o caminho é o mesmo do original:
     ./scripts/og-entregas.sh "<período>" e as tags entram aqui, com a og:url
     apontando pra ESTA página. -->

<!-- Depois da entregas.css, e nunca dentro dela: a ritmo.css só existe nesta

</head>
<!-- ENTREGAS v2. É o entregas.html mais UMA seção: o ritmo das sprints que
     fecharam no período.

     Não é um documento novo escrito do zero, e nem uma cópia do outro: a página
     carrega o MESMO briefing-entregas.js e, por cima dele,
     briefing-entregas-v2.js, que pega o documento pronto e injeta a seção. A
     ordem dos dois <script> é o contrato — o v2 lê o base pelo window. Por isso
     a lista curada de cartões continua existindo num lugar só, e o entregas.html
     segue intocado.

     data-ferramentas="local": mesma postura do original. Esta página também
     pode acabar na mão de alguém, e a barra do PO só se monta em localhost. Em
     produção ela ainda abre com &ferramentas=1, que é como se gera o link de
     leitura (ele usa location.origin, então precisa nascer no endereço de
     produção). --><body data-pagina="report" data-ferramentas="local" class="pagina-entregas">
<div class="app">
<div class="corpo">
<main>
  <section id="secao-report">
    <div id="report"><p class="mudo">carregando…</p></div>
  </section>
</main>
</div>
</div>

<div class="ferramentas" id="ferramentas" hidden>
  <span id="badge" data-estado="sem-token">sem token</span>
  <select id="resp-global" aria-label="Recorte por responsável" title="Recorte por responsável" hidden><option value="">todos os responsáveis</option></select>
  <button id="atualizar" aria-label="Atualizar agora" title="Atualizar agora">↻</button>
  <button id="sem-nome" class="botao-texto" hidden title="Épicos e Features que aparecem no report e ainda não têm nome de negócio — copia a lista em JSON pra preencher assets/report-nomes.json"></button>
  <button id="copiar" class="botao-texto" title="Copia o endereço desta página — quem abrir lê o report sem token">Copiar link</button>
  <!-- Só esta página tem o botão, e é isso que o acende: o report.js procura o
       id e sai calado quando não acha. As outras três edições seguem só com o
       link, onde o dado anda junto com o endereço. -->
  <button id="publicar" class="botao-texto" title="Baixa os dados deste documento pro endereço fixo — o link de quem já tem não muda, só o conteúdo">Publicar dados</button>
  <a id="ver-entregas" class="botao-texto" href="entregas.html?po=1" title="Abrir o documento de Entregas sem a seção de ritmo">v1</a>
  <a id="voltar" class="botao-texto" href="central.html#panorama" title="Voltar para a Central">Central</a>
</div>
<div id="caixa-link" class="caixa-link" hidden></div>

<!-- Visor das telas da galeria. Mora na página, não no documento: o report.js
     redesenha #report inteiro a cada render, e o <dialog> precisa sobreviver a
     isso. Por ser <dialog> nativo, Esc pra fechar, foco preso dentro e fundo
     escurecido vêm de graça — sem biblioteca. -->
<dialog id="visor" class="rl-visor" aria-label="Visualização da tela">
  <button type="button" id="visor-fechar" class="rl-visor-fechar" aria-label="Fechar">✕</button>
  <img id="visor-img" alt="">
  <p id="visor-legenda" class="rl-visor-legenda"></p>
</dialog>

<script src="assets/core.js?v=2026100804"></script>
<script src="assets/api.js?v=2026100804"></script>
<!-- Antes do briefing: ele pega o desenho do roadmap daqui. -->
<script src="assets/roadmap-visao.js?v=2026100804"></script>
<!-- Os dois briefings, nesta ordem: o base desenha o documento, o v2 pega o
     que ele devolveu e acrescenta a seção de ritmo. Invertida a ordem, o v2
     não acha o base e a página não desenha nada. -->
<script src="assets/briefing-entregas.js?v=2026100804"></script>
<script src="assets/briefing-entregas-v2.js?v=2026100804"></script>
<script src="assets/report.js?v=2026100804"></script>
<script>
/* AS ABAS — Entregas e Acompanhar.

   Vive aqui pela mesma razão que o visor da galeria: o report.js é
   compartilhado com três documentos que não têm aba, e o briefing é módulo de
   render puro, testado no Node, que não deve tocar em evento de DOM.

   O clique é delegado em #report porque o documento é redesenhado inteiro a
   cada troca de dado — ouvir no container é o que sobrevive a isso. E a aba
   ativa é reaplicada depois de cada redesenho, senão um refresh de dados jogava
   o leitor de volta pra Entregas no meio da leitura.

   Qual seção é de qual aba vem do próprio documento, em data-acompanhar: quem
   decide isso é quem o desenha, e repetir a lista aqui seria a segunda cópia
   que diverge na primeira seção nova.

   A aba escolhida entra no endereço (#acompanhar), pra que o link
   compartilhado abra onde quem mandou estava. Fragmento que começa com `r=` é
   dado do report e não se toca — nesse caso a aba só não viaja. */
(function () {
  'use strict';
  const box = document.getElementById('report');
  if (!box) return;
  const ehPacote = () => /^#r=/.test(location.hash || '');
  const daUrl = () => (ehPacote() ? '' : (location.hash || '').replace(/^#/, ''));
  let atual = '';

  function aplicar(aba, gravarNaUrl) {
    const nav = box.querySelector('.rl-abas');
    if (!nav) return;
    const conhecidas = [...nav.querySelectorAll('.rl-aba')].map((b) => b.dataset.aba);
    if (!conhecidas.includes(aba)) aba = conhecidas[0];
    atual = aba;
    const deAcompanhar = new Set((nav.dataset.acompanhar || '').split(/\s+/).filter(Boolean));
    for (const sec of box.querySelectorAll('.rl-sec')) {
      const ehDeAcompanhar = deAcompanhar.has(sec.id);
      sec.hidden = ehDeAcompanhar !== (aba === 'acompanhar');
    }
    /* A CAPA PERTENCE À ABA. Em Acompanhar, "Entregas de Outubro" seria meia
       verdade — o título e a linha de apoio trocam.

       O texto de Entregas NÃO é declarado em lugar nenhum: é guardado do que o
       documento base escreveu, na primeira aplicação, e restaurado depois.
       Declará-lo seria uma segunda cópia de uma frase que mora no outro
       arquivo, e as duas divergiriam no primeiro ajuste de texto lá. */
    const btn = nav.querySelector('.rl-aba[data-aba="' + aba + '"]');
    for (const [sel, chave] of [['.rl-titulo-fraco', 'titulo'], ['.rl-capa-situacao', 'situacao']]) {
      const el = box.querySelector(sel);
      if (!el) continue;
      if (el.dataset.orig === undefined) el.dataset.orig = el.textContent;
      el.textContent = (btn && btn.dataset[chave]) || el.dataset.orig;
    }
    for (const b of nav.querySelectorAll('.rl-aba')) {
      b.setAttribute('aria-pressed', String(b.dataset.aba === aba));
    }
    /* Aba sem seção nenhuma mostra a frase dela. O caso real é Entregas num mês
       cujos cartões ainda não foram escritos: sem isto a aba abre com capa,
       abas e rodapé, e lê como documento quebrado. */
    const vazia = !box.querySelector('.rl-sec:not([hidden])');
    for (const p of box.querySelectorAll('.rl-aba-vazia')) {
      p.hidden = !(vazia && p.dataset.de === aba);
    }
    /* Os blocos que só valem em Entregas — hoje, os dois números da capa.

       Somem em Acompanhar, onde contariam entrega e diriam zero ao lado das
       sprints em curso. E somem TAMBÉM quando a própria aba Entregas está
       vazia: dois zeros gigantes em cima de "as entregas ainda estão sendo
       escritas" é a mesma ausência dita duas vezes, e a segunda com peso de
       manchete.

       A regra parceira `[hidden]` está na ritmo.css: sem ela o `display: grid`
       do bloco ganharia do navegador e ele não sumiria. */
    const soEntregas = nav.dataset.soEntregas;
    if (soEntregas) {
      for (const el of box.querySelectorAll(soEntregas)) el.hidden = aba !== 'entregas' || vazia;
    }
    // replaceState, e não um href: trocar de aba não é navegação nova, e encher
    // o histórico faria o Voltar do navegador percorrer cliques de aba em vez
    // de sair da página.
    if (gravarNaUrl && !ehPacote()) {
      history.replaceState(null, '', location.pathname + location.search + '#' + aba);
    }
  }

  box.addEventListener('click', (ev) => {
    const b = ev.target.closest('.rl-aba');
    if (!b) return;
    aplicar(b.dataset.aba, true);
  });

  /* O seletor de edição NAVEGA — a edição antiga é outro arquivo, com a lista
     curada dentro dele. O valor vazio é a edição atual, e aí não há pra onde
     ir. Delegado como o clique das abas, pelo mesmo motivo: o documento é
     redesenhado inteiro a cada troca de dado. */
  box.addEventListener('change', (ev) => {
    const sel = ev.target.closest('.rl-edicao');
    if (!sel || !sel.value) return;
    location.href = sel.value;
  });

  /* O documento é reescrito a cada render do report.js, e a aba ativa some com
     ele. Observar o container devolve o estado sem o report.js precisar saber
     que abas existem. */
  new MutationObserver(() => {
    if (box.querySelector('.rl-abas')) aplicar(atual || daUrl(), false);
  }).observe(box, { childList: true });

  aplicar(daUrl(), false);
})();

/* Visor da galeria — vive aqui, e não no report.js nem no briefing.

   No report.js porque ele é compartilhado com report.html e report-v2.html, que
   não têm galeria; no briefing porque ele é módulo de render puro, testado no
   Node, e não deve tocar em evento de DOM.

   O clique é delegado em #report: o documento é redesenhado a cada troca de
   dado, e ouvir no container é o que sobrevive a isso. O <a> continua válido —
   se este script falhar, o clique leva à imagem como antes. */
(function () {
  'use strict';
  const box = document.getElementById('report');
  const visor = document.getElementById('visor');
  const img = document.getElementById('visor-img');
  const legenda = document.getElementById('visor-legenda');
  if (!box || !visor || !visor.showModal) return; // sem <dialog>, o <a> resolve

  box.addEventListener('click', (ev) => {
    const link = ev.target.closest('.rl-fig-link');
    if (!link) return;
    ev.preventDefault();
    const fig = link.closest('.rl-fig');
    const texto = fig && fig.querySelector('figcaption');
    img.src = link.getAttribute('href');
    img.alt = texto ? texto.textContent : '';
    legenda.textContent = texto ? texto.textContent : '';
    visor.showModal();
  });

  // Fechar solta a imagem na hora, e não no evento `close`: o `close` do
  // <dialog> é disparado de forma assíncrona, então confiar nele deixava o src
  // da tela anterior pendurado por um tempo indefinido. O listener continua
  // como rede pro Esc, que fecha sem passar por aqui.
  function fechar() {
    visor.close();
    img.removeAttribute('src');
  }
  // Clique no fundo fecha: o alvo só é o próprio <dialog> quando o ponto cai
  // fora da área do conteúdo.
  visor.addEventListener('click', (ev) => { if (ev.target === visor) fechar(); });
  document.getElementById('visor-fechar').addEventListener('click', fechar);
  visor.addEventListener('close', () => { img.removeAttribute('src'); });
})();
</script>
</body>
</html>
